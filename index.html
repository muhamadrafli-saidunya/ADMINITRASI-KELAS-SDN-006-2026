<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remix Administrasi Kelas SDN 006 SUNGAI BULUH</title>
    <meta name="description" content="Aplikasi Administrasi Kelas Sekolah Dasar Terpadu: Data Siswa, Presensi, Penilaian Kurikulum Merdeka Pembelajaran Mendalam (KMPM), Jurnal Guru, Raport, Kas Kelas & Inventaris." />
    <meta property="og:title" content="Remix Administrasi Kelas SDN 006 SUNGAI BULUH" />
    <meta property="og:description" content="Aplikasi Administrasi Kelas Sekolah Dasar Terpadu: Data Siswa, Presensi, Penilaian Kurikulum Merdeka Pembelajaran Mendalam (KMPM), Jurnal Guru, Raport, Kas Kelas & Inventaris." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        body {
          background: white !important;
          color: black !important;
        }
        @page {
          margin: 1.2cm;
          size: auto;
        }
      }
      @media screen {
        .print-only {
          display: none !important;
        }
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('adm_sd_darkMode');
          if (saved !== null) {
            if (JSON.parse(saved)) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
